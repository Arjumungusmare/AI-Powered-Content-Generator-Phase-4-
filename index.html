<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>AI-Powered Content Generator</h1>
    </div>

    <section id="section1">
        
        <div class="div">
            <p>Ask Anything</p>
            <input type="text" id="one" placeholder="Ask me anything...">
            <button id="btn1">Ask anything</button>
        </div>

        <div class="div">
            <p>Summarize</p>
            <input type="text" id="two" placeholder="Enter the text here for summary...">
            <button id="btn2">Summarize</button>
        </div>

        <div class="div">
            <p>Generate Ideas</p>
            <input type="text" id="three" placeholder="Give me a topic for ideas✨">
            <button id="btn3">Generate Ideas</button>
        </div>
    </section>

    <section id="section2">
        <div id="div2">
            <p>Ask Definition</p>
            <input type="text" id="four" placeholder="Enter a word to get its definition...">
            <button id="btn4">Find Definition</button>
        </div>

        <div id="div3">
            <textarea id="output" placeholder="Your output will appear here"></textarea>
        </div>
    </section>
    <div id="historyContainer"></div>
    <script type="module" src="script.js"></script>
</body>
</html>
